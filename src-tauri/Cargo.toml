[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
anyhow = "1.0.104"
tokio = { version = "1.53.2", features = ["full"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-store = "2.5.0"
