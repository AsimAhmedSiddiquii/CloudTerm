name: CloudTerm release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run release:version -- --tag "${{ github.ref_name }}"
          npm run lint
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        shell: pwsh
        env:
          CLOUDTERM_UPDATER_PUBLIC_KEY: ${{ vars.CLOUDTERM_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $taggedBuild = $env:GITHUB_REF -like "refs/tags/v*"
          if ($taggedBuild) {
            if ([string]::IsNullOrWhiteSpace($env:CLOUDTERM_UPDATER_PUBLIC_KEY)) {
              throw "Tagged builds require the CLOUDTERM_UPDATER_PUBLIC_KEY repository variable."
            }
            if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
              throw "Tagged builds require the TAURI_SIGNING_PRIVATE_KEY secret."
            }
            npm run tauri build -- --config src-tauri/tauri.release.conf.json
          } else {
            npm run tauri build
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Sign Windows installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $taggedBuild = $env:GITHUB_REF -like "refs/tags/v*"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            if ($taggedBuild) {
              throw "Tagged builds require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD repository secrets."
            }
            Write-Host "No Windows signing certificate configured; leaving this manual build unsigned."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when a Windows signing certificate is configured."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "cloudterm-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
            $artifacts = Get-ChildItem `
              -Path "src-tauri/target/release/bundle/msi/*.msi", "src-tauri/target/release/bundle/nsis/*.exe" `
              -File
            if ($artifacts.Count -eq 0) {
              throw "No Windows installer artifacts were found to sign."
            }
            foreach ($artifact in $artifacts) {
              & $signTool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $artifact.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode signing failed for $($artifact.Name)."
              }
              & $signTool verify /pa /all $artifact.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode verification failed for $($artifact.Name)."
              }
            }
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi", "src-tauri/target/release/bundle/nsis" `
            -File
          if ($installerFiles.Count -eq 0) {
            throw "No Windows installers were produced."
          }
          $checksums = $installerFiles | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content `
            -LiteralPath "src-tauri/target/release/bundle/SHA256SUMS.txt" `
            -Value $checksums `
            -Encoding ascii

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/SHA256SUMS.txt

  bundle-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run lint
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build macOS package
        shell: bash
        env:
          CLOUDTERM_UPDATER_PUBLIC_KEY: ${{ vars.CLOUDTERM_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$CLOUDTERM_UPDATER_PUBLIC_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            npm run tauri build -- --bundles dmg --config src-tauri/tauri.release.conf.json
          else
            npm run tauri build -- --bundles dmg
          fi

      - name: Generate package checksums
        shell: bash
        run: |
          package_dir="src-tauri/target/release/bundle/dmg"
          dmg_file=$(find "$package_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg_file"
          hdiutil imageinfo "$dmg_file" >/dev/null
          checksum_files=("$package_dir"/*)
          macos_dir="src-tauri/target/release/bundle/macos"
          if [[ -d "$macos_dir" ]]; then
            checksum_files+=("$macos_dir"/*)
          fi
          shasum -a 256 "${checksum_files[@]}" > "src-tauri/target/release/bundle/SHA256SUMS-macos.txt"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-macos-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*
            src-tauri/target/release/bundle/SHA256SUMS-macos.txt

  bundle-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run lint
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Linux packages
        shell: bash
        env:
          CLOUDTERM_UPDATER_PUBLIC_KEY: ${{ vars.CLOUDTERM_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$CLOUDTERM_UPDATER_PUBLIC_KEY"
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            npm run tauri build -- --bundles deb,appimage --config src-tauri/tauri.release.conf.json
          else
            npm run tauri build -- --bundles deb,appimage
          fi

      - name: Generate package checksums
        shell: bash
        run: |
          package_dir="src-tauri/target/release/bundle"
          deb_file=$(find "$package_dir/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)
          appimage_file=$(find "$package_dir/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$deb_file"
          test -n "$appimage_file"
          dpkg-deb --info "$deb_file" >/dev/null
          file "$appimage_file" | grep -q 'ELF'
          packages=$(find "$package_dir/deb" "$package_dir/appimage" -maxdepth 1 -type f)
          sha256sum $packages > "$package_dir/SHA256SUMS-linux.txt"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-linux-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/SHA256SUMS-linux.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - bundle-windows
      - bundle-macos
      - bundle-linux
      - release-readiness
    runs-on: ubuntu-22.04

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: CloudTerm-*
          path: release-assets
          merge-multiple: true

      - name: Create updater manifest
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          base = f"https://github.com/AsimAhmedSiddiquii/CloudTerm/releases/download/{tag}"

          def find_asset(suffix):
              matches = sorted(path for path in root.rglob("*") if path.is_file() and path.name.endswith(suffix))
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {suffix} asset, found {len(matches)}: {matches}")
              return matches[0]

          platforms = {}
          for platform, suffix in (
              ("windows-x86_64", "-setup.exe"),
              ("darwin-x86_64", ".app.tar.gz"),
              ("linux-x86_64", ".AppImage"),
          ):
              artifact = find_asset(suffix)
              signature = artifact.with_name(artifact.name + ".sig")
              if not signature.is_file():
                  raise SystemExit(f"Missing updater signature for {artifact.name}: {signature.name}")
              platforms[platform] = {
                  "url": f"{base}/{artifact.name}",
                  "signature": signature.read_text(encoding="utf-8").strip(),
              }

          Path("release-assets/latest.json").write_text(
              json.dumps({
                  "version": version,
                  "notes": f"CloudTerm {tag}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "platforms": platforms,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create release manifest
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          assets = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({
                  "name": path.name,
                  "bytes": path.stat().st_size,
                  "sha256": digest,
              })
          manifest = {
              "product": "CloudTerm",
              "version": os.environ["GITHUB_REF_NAME"].removeprefix("v"),
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "assets": assets,
          }
          Path("release-assets/RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "CloudTerm ${GITHUB_REF_NAME}"

  release-readiness:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - bundle-windows
      - bundle-macos
      - bundle-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Require public-release approval
        env:
          RELEASE_READY: ${{ vars.CLOUDTERM_PUBLIC_RELEASE_READY }}
        run: |
          if [[ "$RELEASE_READY" != "true" ]]; then
            echo "Public release blocked: set the repository variable CLOUDTERM_PUBLIC_RELEASE_READY=true only after completing RELEASE_SIGNING.md." >&2
            exit 1
          fi

