name: CloudTerm release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run release:version -- --tag "${{ github.ref_name }}"
          npm run lint
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npm run tauri build

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi", "src-tauri/target/release/bundle/nsis" `
            -File
          if ($installerFiles.Count -eq 0) {
            throw "No Windows installers were produced."
          }
          $checksums = $installerFiles | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content `
            -LiteralPath "src-tauri/target/release/bundle/SHA256SUMS.txt" `
            -Value $checksums `
            -Encoding ascii

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt

  bundle-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run lint
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build macOS package
        run: npm run tauri build -- --bundles dmg

      - name: Generate package checksums
        shell: bash
        run: |
          package_dir="src-tauri/target/release/bundle/dmg"
          dmg_file=$(find "$package_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg_file"
          hdiutil imageinfo "$dmg_file" >/dev/null
          shasum -a 256 "$package_dir"/* > "src-tauri/target/release/bundle/SHA256SUMS-macos.txt"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-macos-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/SHA256SUMS-macos.txt

  bundle-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run lint
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Linux packages
        run: npm run tauri build -- --bundles deb,appimage

      - name: Generate package checksums
        shell: bash
        run: |
          package_dir="src-tauri/target/release/bundle"
          deb_file=$(find "$package_dir/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)
          appimage_file=$(find "$package_dir/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$deb_file"
          test -n "$appimage_file"
          dpkg-deb --info "$deb_file" >/dev/null
          file "$appimage_file" | grep -q 'ELF'
          packages=$(find "$package_dir/deb" "$package_dir/appimage" -maxdepth 1 -type f)
          sha256sum $packages > "$package_dir/SHA256SUMS-linux.txt"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-linux-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS-linux.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - bundle-windows
      - bundle-macos
      - bundle-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: CloudTerm-*
          path: release-assets
          merge-multiple: true

      - name: Create release manifest
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          assets = sorted(path.name for path in root.rglob("*") if path.is_file())
          manifest = {
              "product": "CloudTerm",
              "version": os.environ["GITHUB_REF_NAME"].removeprefix("v"),
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "assets": assets,
          }
          Path("release-assets/RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "CloudTerm ${GITHUB_REF_NAME}"

