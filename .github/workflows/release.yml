name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run lint
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npm run tauri build

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installerFiles = Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi", "src-tauri/target/release/bundle/nsis" `
            -File
          if ($installerFiles.Count -eq 0) {
            throw "No Windows installers were produced."
          }
          $checksums = $installerFiles | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content `
            -LiteralPath "src-tauri/target/release/bundle/SHA256SUMS.txt" `
            -Value $checksums `
            -Encoding ascii

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CloudTerm-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt

